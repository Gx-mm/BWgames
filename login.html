<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BWGAMES | Play Smart. Win Right.</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="bg-glow"></div>
        <div class="bg-grid"></div>

        <header class="brand-header">
            <h1 class="brand-logo"><span>BW</span>GAMES</h1>
            <p class="brand-tagline">PLAY SMART. WIN RIGHT.</p>
        </header>

        <main class="auth-card">
            
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
                <button type="button" class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <div id="auth-notification" class="notification hidden"></div>

            <section id="login-section" class="auth-section active">
                <div class="section-header">
                    <i class="fa-solid fa-gamepad header-icon"></i>
                    <h2>Welcome Back!</h2>
                    <p>Login to continue your journey</p>
                </div>

                <form id="login-form" novalidate>
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="login-email" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" placeholder="Password" required>
                        <button type="button" class="toggle-password" tabindex="-1">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>

                    <div class="forgot-password-container">
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="primary-btn" id="login-btn">
                        <span class="btn-text">Login</span>
                        <div class="loader hidden"></div>
                    </button>
                </form>

                <div class="auth-footer">
                    <span class="footer-text">OR</span>
                    <p>Don't have an account? <a href="#" onclick="switchTab('signup'); return false;" class="switch-link">Sign Up</a></p>
                </div>
            </section>

            <section id="signup-section" class="auth-section">
                <div class="section-header">
                    <i class="fa-solid fa-user-plus header-icon"></i>
                    <h2>Create Account</h2>
                    <p>Join BWGAMES today</p>
                </div>

                <form id="signup-form" novalidate>
                    <div class="input-group">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="signup-name" placeholder="Full Name" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="signup-email" placeholder="Email" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" id="signup-phone" placeholder="Phone Number" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="signup-password" placeholder="Password" required>
                        <button type="button" class="toggle-password" tabindex="-1">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                        <button type="button" class="toggle-password" tabindex="-1">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>

                    <button type="submit" class="primary-btn" id="signup-btn">
                        <span class="btn-text">CREATE ACCOUNT</span>
                        <div class="loader hidden"></div>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="#" onclick="switchTab('login'); return false;" class="switch-link">Login</a></p>
                </div>
            </section>
        </main>
    </div>

    <script src="key/key.js"></script>
    
    <script src="login.js"></script>
</body>
</html>
